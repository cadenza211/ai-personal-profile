name: Label sync

on:
  push:
    paths:
      - .github/workflows/label-sync.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update the three tracking labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create todo  --color 0e8a16 --description "待填充 / 待处理" --force --repo "$REPO"
          gh label create doing --color fbca04 --description "正在填充或验证" --force --repo "$REPO"
      - name: Apply todo label to the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh issue edit 1 --add-label todo --repo "$REPO"

      - name: List labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh label list --repo "$REPO" --limit 50
